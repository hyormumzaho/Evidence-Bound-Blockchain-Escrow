[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.38"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
bytecode_hash = "ipfs"
fs_permissions = [{ access = "read", path = "test/fixtures" }]

[profile.default.fuzz]
runs = 256

# Both escrow variants compile under this single profile.
# Gas comparisons are invalid if optimizer, via_ir, solc, or evm_version diverge.
